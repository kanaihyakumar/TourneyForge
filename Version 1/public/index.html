<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TourneyForge - Tournaments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>

<div class="wrap">
  <div id="siteHeader"></div>
  <p class="credit-line">Made with <span class="heart">❤️</span> by <span class="handle">Speedy</span> (platoid: Speedy40)</p>

  <section class="card">
    <div class="tc-top" style="display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between;">
      <div>
        <h2 style="margin:0;"><span class="section-icon" aria-hidden="true">🏆</span>Tournaments</h2>
        <p class="hint" style="margin:4px 0 0;">Live, upcoming &amp; completed tournaments across the arena.</p>
      </div>
      <div>
        <label for="tzSelect" style="margin-bottom:4px;">Show times in</label>
        <div class="inset-field">
          <select id="tzSelect"></select>
        </div>
      </div>
    </div>
  </section>

  <div id="liveUpcomingSection">
    <h2 style="margin: 0 0 14px 4px;">🔥 Live &amp; Upcoming</h2>
    <div class="tour-grid" id="liveUpcomingGrid"></div>
    <p class="empty-note" id="noLiveUpcoming" hidden>No live or upcoming tournaments right now - check back soon!</p>
  </div>

  <div id="completedSection" style="margin-top:32px;">
    <button type="button" class="tab-btn" id="toggleCompletedBtn" style="margin-bottom:14px;">📜 Show completed tournaments</button>
    <div class="tour-grid" id="completedGrid" hidden></div>
  </div>

</div>

<div id="loginModalRoot"></div>

<!-- Tournament detail / register modal -->
<div class="modal-overlay" id="tourModalOverlay" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="tourModalTitle" style="max-width:620px;">
    <div class="modal-head">
      <h2 id="tourModalTitle">Tournament</h2>
      <button type="button" class="modal-close" id="tourModalClose" aria-label="Close">✕</button>
    </div>
    <div id="tourModalBody"></div>
  </div>
</div>

<div id="toast" role="status"></div>

<script type="module">
import { TF } from "./shared.js";
import { TFHeader } from "./header.js";
(function(){
  "use strict";

  var tzSelect = document.getElementById('tzSelect');
  var liveUpcomingGrid = document.getElementById('liveUpcomingGrid');
  var noLiveUpcoming = document.getElementById('noLiveUpcoming');
  var completedGrid = document.getElementById('completedGrid');
  var toggleCompletedBtn = document.getElementById('toggleCompletedBtn');
  var toast = document.getElementById('toast');

  var TZ_KEY = 'tf_display_tz';
  function getTZ(){ return localStorage.getItem(TZ_KEY) || 'Asia/Kolkata'; }
  function setTZ(v){ try{ localStorage.setItem(TZ_KEY, v); }catch(e){} }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toast.classList.remove('show'); }, 2400);
  }

  TF.TIMEZONES.forEach(function(tz){
    var opt = document.createElement('option');
    opt.value = tz.id; opt.textContent = tz.label;
    tzSelect.appendChild(opt);
  });
  tzSelect.value = getTZ();
  tzSelect.addEventListener('change', function(){ setTZ(tzSelect.value); renderAll(); });

  var STATUS_BADGE = {
    ongoing: '<span class="badge badge-live">🟢 LIVE NOW</span>',
    upcoming: '<span class="badge badge-upcoming">🕒 UPCOMING</span>',
    completed: '<span class="badge badge-completed">✅ COMPLETED</span>',
    cancelled: '<span class="badge badge-cancelled">🚫 CANCELLED</span>'
  };

  function hostsLine(t){
    var names = (t.hosts && t.hosts.length) ? t.hosts : [t.organizerName || 'TourneyForge'];
    var label = names.length > 1 ? 'Hosts' : 'Host';
    return '🏷️ ' + label + ': ' + TFHeader.escapeHtml(names.join(', '));
  }

  var MEDALS = { 1: '🥇', 2: '🥈', 3: '🥉', 4: '4️⃣' };
  function ordinal(n){
    var s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  function winnersBlock(t){
    if(!t.winners || !t.winners.length) return '';
    var sorted = t.winners.slice().sort(function(a, b){ return a.place - b.place; });
    var rows = sorted.map(function(w){
      return '<div class="podium-row"><span class="medal">' + (MEDALS[w.place] || '🏅') + '</span><span>' +
        TFHeader.escapeHtml(TF.formatPlatoId(w.name)) + '</span><span class="place-label" style="margin-left:auto;">' +
        ordinal(w.place) + ' Place</span></div>';
    }).join('');
    return '<div class="podium" style="margin-bottom:12px;">' +
      '<h3 style="margin:0 0 10px; font-size:0.98rem; font-weight:900;">🏆 Here are the winners!</h3>' + rows + '</div>';
  }
  function closingMessageBlock(t){
    if(!t.closingMessage) return '';
    return '<div class="status-banner ok" style="margin-top:0; margin-bottom:12px;"><span class="icon">💌</span><span>' +
      TFHeader.escapeHtml(t.closingMessage).replace(/\n/g, '<br>') + '</span></div>';
  }

  function card(t){
    var tz = getTZ();
    var when = TF.formatInTZ(t.startUTC, tz) + ' (' + TF.tzLabel(tz) + ')';
    var session = TF.getSession();
    var canManage = TF.canManage(session, t);
    var full = t.teamCapacity && t.registeredCount >= t.teamCapacity;
    var alreadyRegistered = TF.getMyRegistrations().indexOf(t.id) !== -1;

    var el = document.createElement('div');
    el.className = 'tour-card';
    el.innerHTML =
      '<div class="tc-top">' + STATUS_BADGE[t.status] +
        (canManage ? '<button type="button" class="btn btn-sm" data-manage="' + t.id + '">⚙️ Manage</button>' : '') +
      '</div>' +
      '<h3>' + TFHeader.escapeHtml(t.title) + '</h3>' +
      '<div class="tc-meta">' +
        '<span class="tag">🎮 ' + TFHeader.escapeHtml(t.game) + '</span>' +
        (t.teamSize === 2 ? '<span class="tag">👥 2v2</span>' : '') +
        '<span class="tag">⏰ ' + TFHeader.escapeHtml(when) + '</span>' +
        '<span class="tag">👥 ' + t.registeredCount + (t.teamCapacity ? ('/' + t.teamCapacity) : '') + (t.teamSize === 2 ? ' teams' : '') + ' registered</span>' +
      '</div>' +
      winnersBlock(t) +
      closingMessageBlock(t) +
      '<div class="tc-text">' + TFHeader.escapeHtml(t.announcement) + '</div>' +
      '<button type="button" class="tc-readmore" hidden>🔽 Read more</button>' +
      '<div class="tc-organizer">' + hostsLine(t) +
        (t.sponsor ? ' · 🎗️ Sponsored by ' + TFHeader.escapeHtml(t.sponsor) : '') +
      '</div>' +
      '<div class="tc-footer">' +
        '<button type="button" class="btn btn-sm" data-view="' + t.id + '">📋 View details</button>' +
        (t.status === 'completed' || t.status === 'cancelled' ? '' :
          alreadyRegistered ? '<span class="badge badge-live">✅ You\u2019re registered</span>' :
          full ? '<span class="badge badge-cancelled">Slots full</span>' :
          '<button type="button" class="btn btn-primary btn-sm" data-register="' + t.id + '">⚔️ Register</button>') +
      '</div>';

    var textEl = el.querySelector('.tc-text');
    var readMoreBtn = el.querySelector('.tc-readmore');
    // Defer the overflow check until the element is in the DOM & laid out.
    requestAnimationFrame(function () {
      if (textEl.scrollHeight > textEl.clientHeight + 2) {
        readMoreBtn.hidden = false;
        readMoreBtn.addEventListener('click', function () {
          var expanded = textEl.classList.toggle('expanded');
          readMoreBtn.textContent = expanded ? '🔼 Show less' : '🔽 Read more';
        });
      }
    });

    return el;
  }

  function renderAll(){
    liveUpcomingGrid.innerHTML = '<p class="empty-note">Loading tournaments…</p>';
    return TF.listTournaments().then(function(all){
      var liveUpcoming = all.filter(function(t){ return t.status === 'ongoing' || t.status === 'upcoming'; });
      var completed = all.filter(function(t){ return t.status === 'completed' || t.status === 'cancelled'; });

      liveUpcomingGrid.innerHTML = '';
      noLiveUpcoming.hidden = liveUpcoming.length > 0;
      liveUpcoming.forEach(function(t){ liveUpcomingGrid.appendChild(card(t)); });

      completedGrid.innerHTML = '';
      completed.forEach(function(t){ completedGrid.appendChild(card(t)); });
      toggleCompletedBtn.textContent = (completedGrid.hidden ? '📜 Show' : '🔼 Hide') + ' completed tournaments (' + completed.length + ')';

      bindCardActions();
    }).catch(function(err){
      liveUpcomingGrid.innerHTML = '<p class="empty-note">Couldn\u2019t load tournaments - check your Firebase setup (see firebase-config.js) and connection.</p>';
      console.error(err);
    });
  }

  toggleCompletedBtn.addEventListener('click', function(){
    completedGrid.hidden = !completedGrid.hidden;
    toggleCompletedBtn.textContent = (completedGrid.hidden ? '📜 Show' : '🔼 Hide') + ' completed tournaments (' + completedGrid.children.length + ')';
  });

  function bindCardActions(){
    document.querySelectorAll('[data-view]').forEach(function(btn){
      btn.addEventListener('click', function(){ openDetail(btn.getAttribute('data-view')); });
    });
    document.querySelectorAll('[data-register]').forEach(function(btn){
      btn.addEventListener('click', function(){ openDetail(btn.getAttribute('data-register'), true); });
    });
    document.querySelectorAll('[data-manage]').forEach(function(btn){
      btn.addEventListener('click', function(){ location.href = 'dashboard.html?tournament=' + encodeURIComponent(btn.getAttribute('data-manage')); });
    });
  }

  // ---------- Detail / register modal ----------
  var tourModalOverlay = document.getElementById('tourModalOverlay');
  var tourModalTitle = document.getElementById('tourModalTitle');
  var tourModalBody = document.getElementById('tourModalBody');
  document.getElementById('tourModalClose').addEventListener('click', closeDetail);
  tourModalOverlay.addEventListener('click', function(e){ if(e.target === tourModalOverlay) closeDetail(); });

  function closeDetail(){ tourModalOverlay.hidden = true; }

  function openDetail(id, focusRegister){
    TF.getTournament(id).then(function(t){
      if(!t) return;
      var tz = getTZ();
      var when = TF.formatInTZ(t.startUTC, tz) + ' (' + TF.tzLabel(tz) + ')';
      var full = t.teamCapacity && t.registeredCount >= t.teamCapacity;
      var alreadyRegistered = TF.getMyRegistrations().indexOf(t.id) !== -1;
      var canRegister = (t.status === 'upcoming' || t.status === 'ongoing') && !full && !alreadyRegistered;

      tourModalTitle.textContent = t.title;
      tourModalBody.innerHTML =
        '<div class="tc-meta" style="margin-bottom:12px;">' + STATUS_BADGE[t.status] +
          '<span class="tag">🎮 ' + TFHeader.escapeHtml(t.game) + '</span>' +
          (t.teamSize === 2 ? '<span class="tag">👥 2v2</span>' : '') +
          '<span class="tag">⏰ ' + TFHeader.escapeHtml(when) + '</span>' +
          '<span class="tag">👥 ' + t.registeredCount + (t.teamCapacity ? ('/' + t.teamCapacity) : '') + (t.teamSize === 2 ? ' teams' : '') + '</span>' +
        '</div>' +
        winnersBlock(t) +
        closingMessageBlock(t) +
        '<div class="inset" style="padding:14px 16px; white-space:pre-wrap; font-weight:600; margin-bottom:12px;">' + TFHeader.escapeHtml(t.announcement) + '</div>' +
        (t.details ? '<div class="inset" style="padding:14px 16px; white-space:pre-wrap; font-weight:600; margin-bottom:12px; font-size:0.88rem; color:var(--text-soft);">' + TFHeader.escapeHtml(t.details) + '</div>' : '') +
        '<p class="tc-organizer">' + hostsLine(t) +
          (t.sponsor ? ' · 🎗️ Sponsored by ' + TFHeader.escapeHtml(t.sponsor) : '') +
        '</p>' +
        (alreadyRegistered ? '<p class="status-banner ok"><span class="icon">✅</span>You\u2019re already registered for this tournament. Good luck!</p>' : '') +
        (canRegister ?
          '<form id="registerForm">' +
          '<label for="platoIdInput">Your Plato ID</label>' +
          '<div class="inset-field" style="margin-bottom:8px;"><input type="text" id="platoIdInput" placeholder="e.g. ShadowFang" autocomplete="off" required></div>' +
          (t.teamSize === 2 ?
            '<label for="partnerIdInput">Your Partner\u2019s Plato ID</label>' +
            '<div class="inset-field" style="margin-bottom:8px;"><input type="text" id="partnerIdInput" placeholder="e.g. LunaWolf" autocomplete="off" required></div>' +
            '<p class="field-note">👥 This is a 2v2 tournament - register together with your partner, you\u2019ll be matched up as one team.</p>' : '') +
          '<p class="field-note">⚠️ Make sure your Plato ID' + (t.teamSize === 2 ? ' and your partner\u2019s' : '') + ' is correct - if it\u2019s wrong, you won\u2019t be selected as part of the tournament.</p>' +
          '<p id="registerFormError" class="field-note" style="color:var(--danger); display:none;"></p>' +
          '<div class="btn-row"><button type="submit" class="btn btn-primary btn-block">⚔️ Confirm Registration</button></div>' +
          '</form>' :
          (t.status === 'completed' || t.status === 'cancelled' ? '' :
            full ? '<p class="status-banner warn"><span class="icon">⚠️</span>All slots are full for this tournament.</p>' : ''));

      tourModalOverlay.hidden = false;
      var form = document.getElementById('registerForm');
      if(form){
        var formError = document.getElementById('registerFormError');
        form.addEventListener('submit', function(e){
          e.preventDefault();
          var id2 = document.getElementById('platoIdInput').value;
          var partnerInput = document.getElementById('partnerIdInput');
          var partnerId = partnerInput ? partnerInput.value : undefined;

          // Client-side pre-check for 2v2 so the player sees the problem
          // immediately, without waiting on a round-trip to the database.
          if(t.teamSize === 2){
            var cleanId = (id2 || '').trim();
            var cleanPartner = (partnerId || '').trim();
            if(!cleanPartner){
              formError.textContent = '⚠️ Please add your partner\u2019s Plato ID - this is a 2v2 tournament.';
              formError.style.display = 'block';
              return;
            }
            // Compare with "@" stripped so "Name" and "@Name" are correctly
            // treated as the same ID (matches the backend's normalization).
            var normId = cleanId.replace(/@/g, '').toLowerCase();
            var normPartner = cleanPartner.replace(/@/g, '').toLowerCase();
            if(normId && normId === normPartner){
              formError.textContent = '⚠️ Your Plato ID and your partner\u2019s Plato ID can\u2019t be the same.';
              formError.style.display = 'block';
              return;
            }
          }
          formError.style.display = 'none';

          var submitBtn = form.querySelector('button[type="submit"]');
          submitBtn.disabled = true;
          TF.registerParticipant(t.id, id2, partnerId).then(function(res){
            if(res.ok){
              showToast(res.message);
              closeDetail();
              renderAll();
            } else {
              formError.textContent = '⚠️ ' + res.message;
              formError.style.display = 'block';
              submitBtn.disabled = false;
            }
          }).catch(function(err){
            formError.textContent = '⚠️ Something went wrong - please try again.';
            formError.style.display = 'block';
            submitBtn.disabled = false;
            console.error(err);
          });
        });
        if(focusRegister){ document.getElementById('platoIdInput').focus(); }
      }
    });
  }

  TFHeader.render('home');
  renderAll();
  setInterval(renderAll, 60000); // keep live/upcoming status fresh
})();
</script>
</body>
</html>
