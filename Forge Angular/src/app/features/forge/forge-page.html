<tf-page-header logo="🏆" subtitle="Add participants, then build a knockout Match Bracket.">
  <a tfButton size="sm" routerLink="/">🏠 Home</a>
  <a tfButton size="sm" routerLink="/dashboard">🛠️ Dashboard</a>
</tf-page-header>

<tf-credit-line />

@if (store.imported) {
  <tf-banner icon="🎯" spread>
    {{ importText() }}
    <span bannerAside class="sync" [class.failed]="syncFailed()">{{ store.syncStatus() }}</span>
    <button bannerAside type="button" tfButton size="sm" (click)="store.exitTournamentMode()">
      Exit tournament mode
    </button>
  </tf-banner>
}

@if (store.viewOnly()) {
  <tf-banner tone="warn" icon="🔒">{{ finishedNotice }}</tf-banner>
}

<tf-card
  icon="👥"
  title="Participants"
  [hint]="
    store.tournamentMode
      ? 'Participants come from this tournament. Add a new one, or use 🔁 to replace a player who didn\'t show up.'
      : 'Add everyone taking part in this tournament.'
  "
>
  <tf-participants-panel (messages)="messagesId.set(store.tournamentId)" />
</tf-card>

<tf-card
  icon="🏆"
  title="Match Bracket"
  hint="Turn your participant list into a knockout bracket - pick winners each match, then generate the next match set. Works best with Participants added above."
>
  <tf-bracket-panel />
</tf-card>

<tf-scoring-panel />

<tf-contact-line />

<tf-messages-modal [(tournamentId)]="messagesId" />
